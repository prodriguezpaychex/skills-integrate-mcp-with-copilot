<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <button id="account-button" class="account-button" type="button" aria-label="Teacher login">
        👤 Teacher login
      </button>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h3 id="login-title">Teacher sign in</h3>
        <div class="form-group">
          <label for="username">Username:</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="dialog-actions">
          <button type="submit">Sign in</button>
          <button id="cancel-login" class="secondary-button" type="button">Cancel</button>
        </div>
        <div id="login-message" class="message hidden" role="status"></div>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <p id="teacher-required">Sign in as a teacher to register or unregister students.</p>
        <form id="signup-form" hidden>
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="message hidden" role="status"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
